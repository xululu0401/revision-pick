<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200"><rect width="1200" height="1200" fill="#f3f1ec"/><g font-family="Heiti SC,PingFang SC,sans-serif"><text x="80" y="110" font-size="28" fill="#567480" letter-spacing="5">REVISION PICK</text><text x="80" y="245" font-size="90" font-weight="bold" fill="#26363b">改稿取舍台</text><text x="80" y="320" font-size="36" fill="#567480">每一处改动，由你决定</text><rect x="80" y="400" width="1040" height="150" rx="24" fill="#263f49"/><text x="125" y="492" font-size="43" fill="white">3 个变动块 · +3 新增行 · −2 删除行</text><rect x="80" y="610" width="495" height="260" rx="22" fill="#fbefeb" stroke="#d8c7bf"/><rect x="625" y="610" width="495" height="260" rx="22" fill="#edf6ef" stroke="#bdcec2"/><text x="120" y="680" font-size="32" fill="#97553a">原稿</text><text x="665" y="680" font-size="32" fill="#367352">改稿</text><text x="120" y="745" font-size="35" fill="#26363b">周六下午两点</text><text x="665" y="745" font-size="35" fill="#26363b">周六下午三点</text><text x="120" y="820" font-size="28" fill="#567480">保留原稿</text><text x="665" y="820" font-size="28" fill="#567480">采用改稿</text><text x="80" y="965" font-size="35" fill="#26363b">逐块选择 → 合成全文 → 下载带走</text><text x="80" y="1045" font-size="27" fill="#567480">虚构通知示例 · TXT / MD / PNG / JSON</text><text x="80" y="1120" font-size="26" fill="#567480">选择是版本取舍，不代表事实已核实。</text></g></svg>